<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1080"></canvas>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const INK = '#1b1410';
const SKIN_B = '#6fa7c6', SKIN_B_D = '#5a90b0';
const SKIN_F = '#f0b98b';
const GOLD = '#e5b238', GOLD_D = '#b98418';
const GREEN = '#3f7d33', GREEN_D = '#2c5e25';
const ORANGE = '#cb5f26', ORANGE_D = '#9c3f14';

// ---------- helpers ----------
function fs(fill, lw = 1.6) { ctx.fillStyle = fill; ctx.fill(); if (lw) { ctx.lineWidth = lw; ctx.strokeStyle = INK; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke(); } }
function ell(x, y, rx, ry, rot, fill, lw = 1.4) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2); fs(fill, lw); }
function limb(pts, w, fill) {
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const [ww, col] of [[w + 3, INK], [w, fill]]) {
    ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.lineWidth = ww; ctx.strokeStyle = col; ctx.stroke();
  }
}
function curve(pts, col, w) { // quadratic detail line [x0,y0,cx,cy,x1,y1]
  ctx.beginPath(); ctx.moveTo(pts[0], pts[1]); ctx.quadraticCurveTo(pts[2], pts[3], pts[4], pts[5]);
  ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.stroke();
}
function shear(y0, k, fn) { ctx.save(); ctx.transform(1, 0, k, 1, -k * y0, 0); fn(); ctx.restore(); }
function rot(cx, cy, a, fn) { ctx.save(); ctx.translate(cx, cy); ctx.rotate(a); ctx.translate(-cx, -cy); fn(); ctx.restore(); }

// ---------- RAMA ----------
function rama(t) {
  const blink = (t % 3.4) < 0.13 ? 0.1 : 1;
  rot(232, 495, Math.sin(t * 1.3) * 0.006, () => {
    // quiver + arrows (behind)
    ctx.save(); ctx.translate(166, 150); ctx.rotate(-0.22);
    for (let i = 0; i < 4; i++) {
      const ax = -8 + i * 7;
      ctx.beginPath(); ctx.moveTo(ax, 0); ctx.lineTo(ax - 2, -30);
      ctx.strokeStyle = INK; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.stroke();
      ctx.strokeStyle = '#d9a441'; ctx.lineWidth = 2.6; ctx.stroke();
      ctx.beginPath(); ctx.moveTo(ax - 1.4, -25); ctx.lineTo(ax - 5, -37); ctx.lineTo(ax + 2, -31); ctx.closePath(); fs('#c85a2a', 1.1);
    }
    ctx.beginPath(); ctx.moveTo(-14, -2); ctx.lineTo(16, -2); ctx.lineTo(13, 62); ctx.lineTo(-9, 62); ctx.closePath(); fs('#a9631f', 1.8);
    ctx.beginPath(); ctx.rect(-14, 4, 30, 7); fs(GOLD, 1.2);
    ctx.beginPath(); ctx.rect(-12, 40, 26, 6); fs(GOLD, 1.2);
    ctx.restore();

    // green cape
    shear(170, Math.sin(t * 1.7) * 0.012, () => {
      ctx.beginPath();
      ctx.moveTo(186, 166);
      ctx.bezierCurveTo(160, 190, 150, 250, 153, 300);
      ctx.bezierCurveTo(152, 330, 155, 350, 156, 362);
      ctx.quadraticCurveTo(180, 374, 205, 366);
      ctx.lineTo(262, 370);
      ctx.quadraticCurveTo(284, 372, 298, 362);
      ctx.bezierCurveTo(298, 320, 297, 280, 290, 240);
      ctx.bezierCurveTo(286, 205, 280, 185, 274, 168);
      ctx.closePath(); fs(GREEN, 1.8);
      // gold hem
      curve([156, 358, 180, 372, 205, 364], GOLD, 5);
      curve([262, 369, 285, 372, 298, 360], GOLD, 5);
      curve([164, 215, 158, 280, 160, 350], GREEN_D, 2);
      curve([290, 230, 294, 290, 292, 350], GREEN_D, 2);
    });

    // dhoti
    shear(245, Math.sin(t * 1.5 + 1) * 0.014, () => {
      ctx.beginPath();
      ctx.moveTo(194, 244);
      ctx.bezierCurveTo(184, 300, 176, 380, 180, 450);
      ctx.quadraticCurveTo(200, 462, 226, 458);
      ctx.quadraticCurveTo(252, 466, 278, 456);
      ctx.bezierCurveTo(278, 390, 274, 310, 270, 244);
      ctx.closePath(); fs('#e3b13c', 1.8);
      // folds
      const folds = [[200, 262, 193, 350, 190, 440], [208, 262, 204, 360, 205, 452], [258, 262, 262, 360, 266, 452], [250, 262, 252, 380, 252, 458], [270, 270, 270, 360, 274, 440], [192, 330, 196, 400, 188, 446]];
      folds.forEach(f => curve(f, '#bd8820', 1.8));
      // orange front pleat
      ctx.beginPath(); ctx.moveTo(212, 262); ctx.quadraticCurveTo(214, 330, 214, 372); ctx.lineTo(228, 392); ctx.lineTo(250, 366); ctx.quadraticCurveTo(250, 320, 252, 262); ctx.closePath(); fs('#d98e2c', 1.6);
      curve([222, 270, 222, 330, 224, 380], '#a8651a', 1.5);
      curve([232, 270, 233, 330, 236, 380], '#a8651a', 1.5);
      curve([242, 270, 243, 330, 244, 368], '#a8651a', 1.5);
      ctx.beginPath(); ctx.moveTo(214, 372); ctx.lineTo(226, 360); ctx.lineTo(240, 372); ctx.lineTo(228, 392); ctx.closePath(); fs('#c97a22', 1.2);
    });

    // feet
    limb([[201, 450], [199, 476]], 12, SKIN_B); limb([[246, 450], [247, 472]], 12, SKIN_B);
    ell(196, 484, 16, 8, -0.3, SKIN_B, 1.6);
    ell(250, 478, 17, 7, 0.15, SKIN_B, 1.6);
    ctx.beginPath(); ctx.roundRect(187, 462, 26, 9, 3); fs(GOLD, 1.3);
    ctx.beginPath(); ctx.roundRect(224, 457, 26, 9, 3); fs(GOLD, 1.3);
    // re-draw dhoti hem overlap over ankles
    ctx.beginPath(); ctx.moveTo(180, 448); ctx.quadraticCurveTo(200, 462, 226, 456); ctx.lineTo(226, 450); ctx.lineTo(180, 444); ctx.closePath(); ctx.fillStyle = '#e3b13c'; ctx.fill();

    // torso
    ctx.beginPath();
    ctx.moveTo(190, 168); ctx.quadraticCurveTo(232, 150, 274, 168);
    ctx.bezierCurveTo(278, 200, 272, 225, 268, 250);
    ctx.lineTo(196, 250); ctx.bezierCurveTo(192, 225, 186, 200, 190, 168); ctx.closePath(); fs(SKIN_B, 1.8);
    // waist sash
    ctx.beginPath(); ctx.moveTo(193, 240); ctx.quadraticCurveTo(232, 252, 271, 240); ctx.lineTo(272, 264); ctx.quadraticCurveTo(232, 276, 192, 264); ctx.closePath(); fs('#d8861f', 1.8);
    ell(232, 254, 11, 9, 0, '#b3641a', 1.6);
    curve([196, 248, 232, 258, 268, 248], GOLD, 2);

    // left arm (viewer's left): raised palm
    limb([[188, 176], [168, 205], [163, 240]], 25, SKIN_B);
    limb([[163, 240], [180, 232], [196, 214]], 19, SKIN_B);
    // palm
    ctx.save(); ctx.translate(200, 200); ctx.rotate(0.08);
    ctx.beginPath(); ctx.roundRect(-9, -24, 19, 42, 8); fs(SKIN_B, 1.8);
    ctx.beginPath(); ctx.moveTo(-6, -20); ctx.lineTo(-6, 4); ctx.moveTo(-1, -22); ctx.lineTo(-1, 4); ctx.moveTo(4, -20); ctx.lineTo(4, 4);
    ctx.strokeStyle = SKIN_B_D; ctx.lineWidth = 1.1; ctx.stroke();
    ell(0, 8, 4, 5, 0, '#c75a4a', 0.8);
    ctx.restore();
    ctx.beginPath(); ctx.roundRect(151, 198, 27, 12, 3); fs(GOLD, 1.4);   // armlet
    ctx.beginPath(); ctx.roundRect(186, 224, 15, 9, 3); fs(GOLD, 1.3);    // bracelet

    // necklaces
    ctx.beginPath(); ctx.moveTo(204, 168); ctx.quadraticCurveTo(232, 262, 260, 168);
    ctx.strokeStyle = INK; ctx.lineWidth = 9; ctx.lineCap = 'round'; ctx.stroke(); ctx.strokeStyle = GOLD; ctx.lineWidth = 6; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(208, 166); ctx.quadraticCurveTo(232, 218, 256, 166);
    ctx.strokeStyle = INK; ctx.lineWidth = 9; ctx.stroke(); ctx.strokeStyle = '#f0c84e'; ctx.lineWidth = 6; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(210, 164); ctx.quadraticCurveTo(232, 178, 254, 164);
    ctx.strokeStyle = INK; ctx.lineWidth = 8; ctx.stroke(); ctx.strokeStyle = GOLD; ctx.lineWidth = 5; ctx.stroke();
    ell(232, 214, 6, 7, 0, '#d73b3b', 1.4); ell(232, 233, 4, 5, 0, '#d73b3b', 1.2);
    ell(232, 214, 8, 9, 0, 'rgba(0,0,0,0)', 1.2);

    // right arm: holds bow
    limb([[270, 176], [281, 210], [284, 240]], 24, SKIN_B);
    ctx.beginPath(); ctx.roundRect(268, 194, 24, 12, 3); fs(GOLD, 1.4);

    // bow (in front of dhoti, behind fist)
    ctx.beginPath(); ctx.moveTo(297, 50);
    ctx.bezierCurveTo(318, 120, 300, 200, 284, 240);
    ctx.bezierCurveTo(262, 300, 258, 390, 281, 458);
    ctx.lineCap = 'round'; ctx.strokeStyle = INK; ctx.lineWidth = 9; ctx.stroke(); ctx.strokeStyle = '#a2551a'; ctx.lineWidth = 5.5; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(297, 52); ctx.lineTo(278, 400); ctx.lineTo(281, 458);
    ctx.strokeStyle = 'rgba(27,20,16,.85)'; ctx.lineWidth = 1; ctx.stroke();
    // fist
    ctx.beginPath(); ctx.roundRect(274, 228, 22, 26, 8); fs(SKIN_B, 1.8);
    curve([276, 238, 285, 241, 295, 238], SKIN_B_D, 1.2); curve([276, 245, 285, 248, 295, 245], SKIN_B_D, 1.2);
    ctx.beginPath(); ctx.roundRect(274, 222, 22, 8, 3); fs(GOLD, 1.3);

    // ---- head ----
    rot(232, 160, Math.sin(t * 1.1) * 0.014, () => {
      // halo
      const gl = 0.75 + 0.25 * Math.sin(t * 2.2);
      ctx.save(); ctx.shadowColor = `rgba(255,210,90,${gl})`; ctx.shadowBlur = 24;
      ell(232, 94, 43, 43, 0, GREEN, 2);
      ctx.restore();
      ell(232, 94, 43, 43, 0, 'rgba(0,0,0,0)', 1.8);
      ctx.beginPath(); ctx.arc(232, 94, 38, 0, Math.PI * 2); ctx.strokeStyle = GOLD; ctx.lineWidth = 3; ctx.setLineDash([2, 5]); ctx.stroke(); ctx.setLineDash([]);
      // long hair behind
      ctx.beginPath(); ctx.moveTo(206, 100); ctx.bezierCurveTo(196, 140, 198, 170, 196, 188);
      ctx.lineTo(218, 160); ctx.lineTo(246, 160); ctx.lineTo(268, 188);
      ctx.bezierCurveTo(268, 170, 270, 140, 258, 100); ctx.closePath(); fs('#17110d', 1.6);
      // neck
      ctx.beginPath(); ctx.moveTo(222, 140); ctx.lineTo(222, 168); ctx.quadraticCurveTo(232, 174, 242, 168); ctx.lineTo(242, 140); ctx.closePath(); fs(SKIN_B, 1.6);
      // ears + earrings
      ell(210, 122, 4, 8, 0, SKIN_B, 1.3); ell(254, 122, 4, 8, 0, SKIN_B, 1.3);
      ell(209, 136, 3.6, 4.4, 0, GOLD, 1.2); ell(255, 136, 3.6, 4.4, 0, GOLD, 1.2);
      // face
      ctx.beginPath(); ctx.moveTo(211, 108);
      ctx.bezierCurveTo(210, 138, 220, 150, 232, 152);
      ctx.bezierCurveTo(244, 150, 254, 138, 253, 108);
      ctx.bezierCurveTo(250, 92, 214, 92, 211, 108); ctx.closePath(); fs(SKIN_B, 1.8);
      // hair cap
      ctx.beginPath(); ctx.moveTo(209, 112); ctx.bezierCurveTo(206, 85, 222, 80, 232, 80);
      ctx.bezierCurveTo(242, 80, 258, 85, 255, 112); ctx.bezierCurveTo(252, 96, 246, 93, 232, 93);
      ctx.bezierCurveTo(218, 93, 212, 96, 209, 112); ctx.closePath(); fs('#17110d', 1.4);
      // tilak
      ctx.beginPath(); ctx.moveTo(224, 92); ctx.quadraticCurveTo(232, 114, 240, 92); ctx.lineTo(237, 92); ctx.quadraticCurveTo(232, 106, 227, 92); ctx.closePath(); fs('#f4f4ee', 1);
      ctx.beginPath(); ctx.moveTo(232, 93); ctx.lineTo(232, 108); ctx.strokeStyle = '#c92a2a'; ctx.lineWidth = 2.4; ctx.stroke();
      // brows
      curve([217, 110, 223, 106, 229, 109], INK, 2.2); curve([235, 109, 241, 106, 247, 110], INK, 2.2);
      // eyes
      for (const ex of [223, 241]) {
        ctx.save(); ctx.translate(ex, 117); ctx.scale(1, blink);
        ctx.beginPath(); ctx.moveTo(-7, 0); ctx.quadraticCurveTo(0, -6, 7, 0); ctx.quadraticCurveTo(0, 5, -7, 0); ctx.closePath(); fs('#f5f5ee', 1.3);
        ctx.beginPath(); ctx.arc(0, 0, 2.7, 0, 7); ctx.fillStyle = INK; ctx.fill();
        ctx.restore();
      }
      // nose + mouth
      curve([232, 119, 229, 129, 233, 131], SKIN_B_D, 1.6);
      ctx.beginPath(); ctx.moveTo(226, 140); ctx.quadraticCurveTo(232, 143, 238, 140); ctx.quadraticCurveTo(232, 147, 226, 140); ctx.closePath(); fs('#b3453f', 1.1);

      // crown
      ctx.beginPath(); ctx.moveTo(204, 94); ctx.bezierCurveTo(200, 70, 214, 62, 222, 56);
      ctx.bezierCurveTo(226, 52, 230, 46, 232, 42); ctx.bezierCurveTo(234, 46, 238, 52, 242, 56);
      ctx.bezierCurveTo(250, 62, 264, 70, 260, 94); ctx.quadraticCurveTo(232, 86, 204, 94); ctx.closePath(); fs('#e8b93a', 1.8);
      ctx.beginPath(); ctx.moveTo(214, 88); ctx.quadraticCurveTo(212, 70, 232, 56); ctx.quadraticCurveTo(252, 70, 250, 88); ctx.quadraticCurveTo(232, 82, 214, 88); ctx.closePath(); fs('#f4cc55', 1.2);
      ell(232, 72, 5, 6, 0, '#d73b3b', 1.2);
      ell(220, 82, 2.6, 2.6, 0, '#d73b3b', 0.8); ell(244, 82, 2.6, 2.6, 0, '#d73b3b', 0.8);
      ctx.beginPath(); ctx.roundRect(205, 86, 54, 8, 3); fs(GOLD_D, 1.4);
    });
  });
}

// ---------- SITA ----------
function sita(t) {
  const blink = ((t + 1.1) % 3.9) < 0.13 ? 0.1 : 1;
  rot(342, 495, Math.sin(t * 1.3 + 0.8) * 0.006, () => {
    // veil behind
    shear(120, Math.sin(t * 1.4) * 0.016, () => {
      ctx.beginPath(); ctx.moveTo(332, 108);
      ctx.bezierCurveTo(310, 125, 316, 170, 318, 186);
      ctx.lineTo(380, 180);
      ctx.bezierCurveTo(386, 240, 380, 330, 376, 392);
      ctx.quadraticCurveTo(396, 402, 414, 388);
      ctx.bezierCurveTo(418, 320, 414, 230, 396, 170);
      ctx.bezierCurveTo(388, 130, 370, 106, 352, 100); ctx.closePath(); fs('#cd6a2a', 1.8);
      ctx.beginPath(); ctx.moveTo(370, 130); ctx.bezierCurveTo(378, 190, 380, 300, 376, 392);
      ctx.quadraticCurveTo(394, 398, 402, 388); ctx.bezierCurveTo(402, 300, 396, 200, 382, 150); ctx.closePath(); fs('#8a3416', 1.2);
      curve([398, 180, 408, 290, 410, 384], GOLD, 4);
      curve([376, 390, 392, 400, 413, 388], GOLD, 4);
      // black braid/hair strand
      ctx.beginPath(); ctx.moveTo(378, 175); ctx.bezierCurveTo(396, 240, 394, 300, 388, 350);
      ctx.lineWidth = 7; ctx.strokeStyle = INK; ctx.lineCap = 'round'; ctx.stroke();
    });

    // skirt
    shear(240, Math.sin(t * 1.6 + 2) * 0.012, () => {
      ctx.beginPath(); ctx.moveTo(303, 236);
      ctx.bezierCurveTo(296, 300, 288, 390, 292, 468);
      ctx.quadraticCurveTo(320, 478, 340, 470);
      ctx.quadraticCurveTo(366, 478, 392, 466);
      ctx.bezierCurveTo(388, 390, 382, 300, 374, 236); ctx.closePath(); fs(ORANGE, 1.8);
      const f = [[312, 255, 304, 360, 302, 460], [326, 255, 322, 370, 322, 468], [342, 255, 344, 370, 342, 472], [358, 255, 362, 370, 366, 470], [372, 262, 376, 360, 380, 460], [310, 330, 308, 400, 300, 448]];
      f.forEach(c => curve(c, ORANGE_D, 1.7));
      // gold hem band
      ctx.beginPath(); ctx.moveTo(292, 450); ctx.quadraticCurveTo(320, 462, 340, 454); ctx.quadraticCurveTo(366, 462, 390, 450);
      ctx.lineTo(392, 466); ctx.quadraticCurveTo(366, 478, 340, 470); ctx.quadraticCurveTo(320, 478, 292, 468); ctx.closePath(); fs(GOLD, 1.5);
      curve([294, 459, 320, 468, 340, 462], GOLD_D, 1.4); curve([340, 462, 366, 470, 390, 458], GOLD_D, 1.4);
    });

    // feet
    limb([[316, 466], [316, 486]], 9, SKIN_F); limb([[368, 464], [368, 480]], 9, SKIN_F);
    ell(317, 492, 14, 6, 0.1, SKIN_F, 1.5);
    ell(369, 486, 14, 6, -0.1, SKIN_F, 1.5);
    ctx.beginPath(); ctx.roundRect(303, 470, 22, 7, 3); fs(GOLD, 1.2);
    ctx.beginPath(); ctx.roundRect(356, 466, 22, 7, 3); fs(GOLD, 1.2);

    // blouse / torso
    ctx.beginPath(); ctx.moveTo(320, 190); ctx.quadraticCurveTo(348, 182, 378, 190);
    ctx.bezierCurveTo(382, 210, 376, 226, 374, 242); ctx.lineTo(306, 242);
    ctx.bezierCurveTo(308, 222, 316, 208, 320, 190); ctx.closePath(); fs('#2f7a3a', 1.8);
    // midriff skin
    ctx.beginPath(); ctx.moveTo(308, 226); ctx.quadraticCurveTo(341, 236, 373, 226); ctx.lineTo(374, 242); ctx.lineTo(306, 242); ctx.closePath(); fs(SKIN_F, 1.4);
    curve([306, 226, 340, 238, 374, 226], GOLD, 3);
    // pallu across (orange drape)
    ctx.beginPath(); ctx.moveTo(366, 186); ctx.quadraticCurveTo(384, 200, 380, 232);
    ctx.quadraticCurveTo(340, 250, 304, 240); ctx.lineTo(306, 224); ctx.quadraticCurveTo(342, 232, 364, 206); ctx.closePath(); fs(ORANGE, 1.6);
    curve([368, 192, 376, 210, 372, 232], GOLD, 3);
    // neck
    ctx.beginPath(); ctx.moveTo(343, 168); ctx.lineTo(343, 190); ctx.quadraticCurveTo(352, 196, 361, 190); ctx.lineTo(361, 168); ctx.closePath(); fs(SKIN_F, 1.4);

    // arms: both converge on lotus
    limb([[322, 200], [313, 232], [326, 258]], 14, SKIN_F);
    limb([[376, 202], [380, 236], [350, 262]], 13, SKIN_F);
    ctx.beginPath(); ctx.roundRect(306, 193, 24, 9, 3); fs('#2f7a3a', 1.2);
    ctx.beginPath(); ctx.roundRect(366, 193, 20, 9, 3); fs('#2f7a3a', 1.2);
    // lotus stem + flower
    ctx.beginPath(); ctx.moveTo(326, 262); ctx.quadraticCurveTo(320, 300, 316, 336);
    ctx.strokeStyle = INK; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.stroke(); ctx.strokeStyle = '#4c9a3c'; ctx.lineWidth = 2.6; ctx.stroke();
    ctx.save(); ctx.translate(324, 248); ctx.rotate(Math.sin(t * 1.8) * 0.04);
    const petals = [[-18, -7, -0.9], [18, -7, 0.9], [-9, -16, -0.4], [9, -16, 0.4], [0, -20, 0]];
    ctx.translate(0, 8);
    petals.forEach(([px, py, a], i) => { ctx.save(); ctx.translate(px * 0.55, py * 0.55 + 4); ctx.rotate(a); ctx.beginPath(); ctx.moveTo(0, 8); ctx.quadraticCurveTo(-8, -4, 0, -17); ctx.quadraticCurveTo(8, -4, 0, 8); fs(i < 2 ? '#e4637d' : (i < 4 ? '#ee7f93' : '#f59aa9'), 1.3); ctx.restore(); });
    ctx.restore();
    ell(329, 262, 6, 5, 0, SKIN_F, 1.4); ell(346, 262, 5, 4.5, 0, SKIN_F, 1.4);
    // bangles
    ctx.beginPath(); ctx.roundRect(318, 250, 14, 6, 2); fs(GOLD, 1.1);
    ctx.beginPath(); ctx.roundRect(352, 252, 12, 5, 2); fs(GOLD, 1.1);
    ctx.beginPath(); ctx.roundRect(374, 226, 12, 5, 2); fs(GOLD, 1.1);

    // necklaces
    ctx.beginPath(); ctx.moveTo(334, 190); ctx.quadraticCurveTo(352, 232, 372, 190);
    ctx.strokeStyle = INK; ctx.lineWidth = 7; ctx.stroke(); ctx.strokeStyle = GOLD; ctx.lineWidth = 4; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(338, 188); ctx.quadraticCurveTo(352, 206, 368, 188);
    ctx.strokeStyle = INK; ctx.lineWidth = 7; ctx.stroke(); ctx.strokeStyle = '#f0c84e'; ctx.lineWidth = 4; ctx.stroke();
    ell(352, 208, 4, 5, 0, '#d73b3b', 1.1);

    // ---- head ----
    rot(352, 176, Math.sin(t * 1.0 + 1) * 0.014 - 0.07, () => {
      // hair back
      ctx.beginPath(); ctx.moveTo(332, 120); ctx.bezierCurveTo(326, 150, 330, 170, 336, 180);
      ctx.lineTo(368, 180); ctx.bezierCurveTo(376, 170, 378, 150, 372, 120); ctx.closePath(); fs('#17110d', 1.6);
      // face
      ctx.beginPath(); ctx.moveTo(335, 130);
      ctx.bezierCurveTo(336, 156, 344, 168, 352, 170);
      ctx.bezierCurveTo(360, 168, 369, 156, 370, 130);
      ctx.bezierCurveTo(366, 112, 339, 112, 335, 130); ctx.closePath(); fs(SKIN_F, 1.8);
      ell(333, 142, 3, 6, 0, SKIN_F, 1.1); ell(372, 142, 3, 6, 0, SKIN_F, 1.1);
      ell(333, 152, 3, 4, 0, GOLD, 1.1); ell(372, 152, 3, 4, 0, GOLD, 1.1);
      // hair top + parting
      ctx.beginPath(); ctx.moveTo(333, 134); ctx.bezierCurveTo(330, 108, 342, 100, 352, 100);
      ctx.bezierCurveTo(362, 100, 374, 108, 371, 134); ctx.bezierCurveTo(368, 118, 360, 114, 352, 116);
      ctx.bezierCurveTo(344, 114, 336, 118, 333, 134); ctx.closePath(); fs('#17110d', 1.4);
      // brows, eyes (gazing left toward Rama)
      curve([338, 134, 343, 130, 349, 133], INK, 1.9); curve([356, 133, 361, 130, 367, 134], INK, 1.9);
      for (const ex of [343, 361]) {
        ctx.save(); ctx.translate(ex, 140); ctx.scale(1, blink);
        ctx.beginPath(); ctx.moveTo(-6, 0); ctx.quadraticCurveTo(0, -5, 6, 0); ctx.quadraticCurveTo(0, 4.5, -6, 0); ctx.closePath(); fs('#f7f4ec', 1.2);
        ctx.beginPath(); ctx.arc(-1.8, 0, 2.4, 0, 7); ctx.fillStyle = INK; ctx.fill();
        ctx.restore();
      }
      curve([352, 143, 349, 151, 353, 152], '#c98c63', 1.4);
      ctx.beginPath(); ctx.moveTo(346, 158); ctx.quadraticCurveTo(352, 161, 358, 158); ctx.quadraticCurveTo(352, 164, 346, 158); ctx.closePath(); fs('#c0403c', 1);
      // bindi
      ell(352, 126, 2.1, 2.1, 0, '#c92a2a', 0.5);
      // tiara
      ctx.beginPath(); ctx.moveTo(335, 118); ctx.lineTo(338, 106); ctx.lineTo(344, 112); ctx.lineTo(352, 94); ctx.lineTo(360, 112); ctx.lineTo(366, 106); ctx.lineTo(369, 118);
      ctx.quadraticCurveTo(352, 112, 335, 118); ctx.closePath(); fs('#e8b93a', 1.6);
      ell(352, 106, 3.4, 4, 0, '#d73b3b', 0.9);
      ell(344, 114, 2, 2, 0, '#2f9a8a', 0.6); ell(360, 114, 2, 2, 0, '#2f9a8a', 0.6);
      // veil over crown edge (front drape)
      ctx.beginPath(); ctx.moveTo(366, 108); ctx.bezierCurveTo(380, 120, 384, 150, 380, 178); ctx.lineTo(372, 178); ctx.bezierCurveTo(376, 150, 374, 128, 364, 116); ctx.closePath(); fs('#cd6a2a', 1.4);
    });
  });
}

// ---------- background ----------
function rnd(n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
const PET = Array.from({ length: 46 }, (_, i) => ({ x: rnd(i) * 1080, y: rnd(i + 99) * 1300, s: 7 + rnd(i + 3) * 11, v: 28 + rnd(i + 7) * 45, ph: rnd(i + 11) * 6.28, c: ['#f3a1b0', '#f6c46a', '#ee8aa0', '#fbe0a8'][i % 4], r: rnd(i + 17) * 6.28 }));

function background(t) {
  const g = ctx.createRadialGradient(540, 470, 60, 540, 540, 820);
  g.addColorStop(0, '#fff6dd'); g.addColorStop(0.55, '#fbd89a'); g.addColorStop(1, '#e8924f');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 1080, 1080);
  // rotating rays
  ctx.save(); ctx.translate(540, 470); ctx.rotate(t * 0.05);
  for (let i = 0; i < 28; i++) {
    ctx.rotate(Math.PI * 2 / 28);
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(1100, -34); ctx.lineTo(1100, 34); ctx.closePath();
    ctx.fillStyle = 'rgba(255,248,215,0.16)'; ctx.fill();
  }
  ctx.restore();
  // mandala rings
  ctx.save(); ctx.translate(540, 470);
  for (let k = 0; k < 3; k++) {
    ctx.save(); ctx.rotate(t * (0.08 - k * 0.05));
    const R = 380 + k * 60, n = 36 + k * 12;
    for (let i = 0; i < n; i++) {
      ctx.rotate(Math.PI * 2 / n);
      ctx.beginPath(); ctx.ellipse(R, 0, 14, 5, 0, 0, 7); ctx.fillStyle = `rgba(200,100,40,${0.18 - k * 0.04})`; ctx.fill();
    }
    ctx.restore();
  }
  ctx.restore();
  // ground glow + shadow
  const gg = ctx.createRadialGradient(540, 985, 10, 540, 985, 330);
  gg.addColorStop(0, 'rgba(120,60,20,.35)'); gg.addColorStop(1, 'rgba(120,60,20,0)');
  ctx.fillStyle = gg; ctx.fillRect(0, 700, 1080, 380);
}
function petals(t) {
  PET.forEach(p => {
    const y = (p.y + t * p.v) % 1300 - 110, x = p.x + Math.sin(t * 0.9 + p.ph) * 40;
    ctx.save(); ctx.translate(x, y); ctx.rotate(p.r + t * 0.8);
    ctx.scale(1, 0.5 + 0.5 * Math.abs(Math.sin(t * 1.3 + p.ph)));
    ctx.beginPath(); ctx.ellipse(0, 0, p.s, p.s * 0.5, 0, 0, 7); ctx.fillStyle = p.c; ctx.globalAlpha = 0.85; ctx.fill(); ctx.restore();
  });
  ctx.globalAlpha = 1;
}
function sparkles(t) {
  // twinkles around lotus & halo (design coords -> screen via scene transform)
  for (let i = 0; i < 6; i++) {
    const a = t * 1.6 + i * 1.05, r = 0.5 + 0.5 * Math.sin(a);
    const cx = i < 3 ? 324 : 232, cy = i < 3 ? 248 : 94, rad = i < 3 ? 26 : 60;
    const x = cx + Math.cos(i * 2.1 + t * 0.5) * rad, y = cy + Math.sin(i * 2.1 + t * 0.5) * rad * 0.8;
    ctx.save(); ctx.translate(x, y); ctx.globalAlpha = r;
    ctx.fillStyle = '#fff6c2';
    ctx.beginPath(); for (let k = 0; k < 8; k++) { const rr = k % 2 ? 1.6 : 6 * r + 1; const an = k * Math.PI / 4; ctx.lineTo(Math.cos(an) * rr, Math.sin(an) * rr); } ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

window.draw = function (t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  background(t);
  petals(t);
  const k = Math.min(1, t / 1.0), e = 1 - Math.pow(1 - k, 3);
  ctx.save();
  ctx.globalAlpha = e;
  ctx.translate(-24, (1 - e) * 24 + 8); ctx.scale(2, 2);
  // soft ground shadow
  ctx.save(); ctx.fillStyle = 'rgba(90,40,10,.28)'; ctx.beginPath(); ctx.ellipse(282, 498, 150, 8, 0, 0, 7); ctx.fill(); ctx.restore();
  // Rama's left (ours) slides in from left, Sita from right
  ctx.save(); ctx.translate(-(1 - e) * 40, 0); rama(t); ctx.restore();
  ctx.save(); ctx.translate((1 - e) * 40, 0); sita(t); ctx.restore();
  sparkles(t);
  ctx.restore();
  ctx.globalAlpha = 1;
};
draw(2);
</script></body></html>
