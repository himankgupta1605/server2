<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1200" height="1500"></canvas>
<script>
// =====================================================================
//  Rama & Sita — painterly "realistic" rendering, 100% canvas code.
//  Static art is painted once into layers (soft blurred shading, gradients),
//  then layers are composed and animated per frame.
// =====================================================================
const W = 1200, H = 1500, S = 2.9, TX = -226, TY = -40;
const cv = document.getElementById('c'), out = cv.getContext('2d');
let ctx;
const RX = 205, SX = 355;                       // character centres (design space)

function layer() { const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d'); g.setTransform(S, 0, 0, S, TX, TY); ctx = g; return { c, g }; }
function rnd(n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
function lg(x0, y0, x1, y1, st) { const g = ctx.createLinearGradient(x0, y0, x1, y1); st.forEach(([o, c]) => g.addColorStop(o, c)); return g; }
function rg(x, y, r0, r1, st) { const g = ctx.createRadialGradient(x, y, r0, x, y, r1); st.forEach(([o, c]) => g.addColorStop(o, c)); return g; }
const gold = (x0, y0, x1, y1) => lg(x0, y0, x1, y1, [[0, '#fff1a8'], [.22, '#f2c648'], [.5, '#b87b1c'], [.75, '#eab93d'], [1, '#7d4f10']]);

// shaded(): fill a shape, then add soft blurred shading clipped to the shape
function shaded(path, base, layers) {
  ctx.save(); path(); ctx.clip(); ctx.fillStyle = base; path(); ctx.fill();
  for (const l of layers) {
    ctx.save(); ctx.filter = `blur(${(l.b || 3) * S}px)`; ctx.globalAlpha = l.a == null ? 1 : l.a;
    ctx.fillStyle = l.c; ctx.strokeStyle = l.c; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; l.f(); ctx.restore();
  }
  ctx.restore();
}
const edge = (path, w = 5, a = .6, c = 'rgba(10,6,4,1)', b = 3) => ({ c, a, b, f: () => { path(); ctx.lineWidth = w; ctx.stroke(); } });
const blob = (x, y, rx, ry, c, a, b, rot = 0) => ({ c, a, b, f: () => { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, 7); ctx.fill(); } });
const sline = (pts, w, c, a, b) => ({ c, a, b, f: () => { ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]); ctx.lineWidth = w; ctx.stroke(); } });
const qline = (x0, y0, cx, cy, x1, y1, w, c, a, b) => ({ c, a, b, f: () => { ctx.beginPath(); ctx.moveTo(x0, y0); ctx.quadraticCurveTo(cx, cy, x1, y1); ctx.lineWidth = w; ctx.stroke(); } });

function bands(x0, x1, y0, y1, n, off, seed = 0) {
  const w = (x1 - x0) / n;
  for (let i = 0; i < n; i++) {
    const x = x0 + w * (i + .5) + (off ? w * .3 : -w * .12) + (rnd(i * 3 + 1 + seed) - .5) * w * .5;
    ctx.beginPath(); ctx.moveTo(x, y0);
    ctx.bezierCurveTo(x + (rnd(i + 7 + seed) - .5) * 8, y0 + (y1 - y0) * .35, x + (rnd(i + 13 + seed) - .5) * 10, y0 + (y1 - y0) * .7, x + (rnd(i + 19 + seed) - .5) * 12, y1);
    ctx.lineWidth = w * (off ? .26 : .44); ctx.lineCap = 'round'; ctx.stroke();
  }
}
function silk(path, base, hi, lo, x0, x1, y0, y1, n, seed = 0) {
  shaded(path, base, [
    { c: lo, a: .65, b: 2.6, f: () => bands(x0, x1, y0, y1, n, 0, seed) },
    { c: hi, a: .55, b: 2.2, f: () => bands(x0, x1, y0, y1, n, 1, seed) },
    { c: lo, a: .35, b: 7, f: () => bands(x0, x1, y0, y1, Math.max(2, n >> 1), 0, seed + 40) },
    edge(path, 6, .75)]);
}
// tapered tube (limbs, fingers)
function dens(pts, ws, k = 10) {
  const P = [], Wd = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
    for (let j = 0; j < k; j++) {
      const t = j / k, t2 = t * t, t3 = t2 * t, f = a => 0.5 * ((2 * p1[a]) + (-p0[a] + p2[a]) * t + (2 * p0[a] - 5 * p1[a] + 4 * p2[a] - p3[a]) * t2 + (-p0[a] + 3 * p1[a] - 3 * p2[a] + p3[a]) * t3);
      P.push([f(0), f(1)]); Wd.push(ws[i] * (1 - t) + ws[i + 1] * t);
    }
  }
  P.push(pts[pts.length - 1]); Wd.push(ws[ws.length - 1]); return [P, Wd];
}
function tubePath(pts, ws) {
  const [P, Wd] = dens(pts, ws), L = [], R = [], n = P.length;
  let ang0 = 0, ang1 = 0;
  for (let i = 0; i < n; i++) {
    const a = P[Math.max(0, i - 1)], b = P[Math.min(n - 1, i + 1)];
    let dx = b[0] - a[0], dy = b[1] - a[1]; const l = Math.hypot(dx, dy) || 1; dx /= l; dy /= l;
    const nx = -dy, ny = dx, w = Wd[i] / 2;
    L.push([P[i][0] + nx * w, P[i][1] + ny * w]); R.push([P[i][0] - nx * w, P[i][1] - ny * w]);
    if (i === 0) ang0 = Math.atan2(R[0][1] - P[0][1], R[0][0] - P[0][0]);
    if (i === n - 1) ang1 = Math.atan2(L[i][1] - P[i][1], L[i][0] - P[i][0]);
  }
  ctx.beginPath(); ctx.moveTo(L[0][0], L[0][1]);
  for (let i = 1; i < n; i++) ctx.lineTo(L[i][0], L[i][1]);
  ctx.arc(P[n - 1][0], P[n - 1][1], Wd[n - 1] / 2, ang1, ang1 - Math.PI, true);
  for (let i = n - 1; i >= 0; i--) ctx.lineTo(R[i][0], R[i][1]);
  ctx.arc(P[0][0], P[0][1], Wd[0] / 2, ang0, ang0 - Math.PI, true);
  ctx.closePath();
}
function limb(pts, ws, sk, lightDX = -.2) {
  const path = () => tubePath(pts, ws);
  const avg = ws.reduce((a, b) => a + b, 0) / ws.length;
  const lp = pts.map(p => [p[0] + lightDX * avg * .8, p[1] - avg * .05]);
  shaded(path, sk.base, [
    edge(path, avg * .55, .7, sk.deep, 2),
    sline(lp, avg * .38, sk.light, .6, avg * .22)]);
}
function jewel(path, w, grad) {            // metallic stroke with drop shadow + specular
  ctx.save(); ctx.filter = `blur(${1.2 * S}px)`; ctx.translate(0, 1.6); path(); ctx.strokeStyle = 'rgba(0,0,0,.45)'; ctx.lineWidth = w + 1; ctx.stroke(); ctx.restore();
  path(); ctx.strokeStyle = '#6a430c'; ctx.lineWidth = w + .9; ctx.lineCap = 'round'; ctx.stroke();
  path(); ctx.strokeStyle = grad; ctx.lineWidth = w; ctx.stroke();
  ctx.save(); ctx.translate(-.35, -.4); path(); ctx.strokeStyle = 'rgba(255,248,200,.75)'; ctx.lineWidth = Math.max(.5, w * .26); ctx.stroke(); ctx.restore();
}
function gem(x, y, r, c1, c2) {
  ctx.save(); ctx.filter = `blur(${.8 * S}px)`; ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.beginPath(); ctx.arc(x + .3, y + .9, r + .8, 0, 7); ctx.fill(); ctx.restore();
  ctx.beginPath(); ctx.arc(x, y, r + .9, 0, 7); ctx.fillStyle = gold(x - r, y - r, x + r, y + r); ctx.fill();
  ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fillStyle = rg(x - r * .3, y - r * .3, r * .1, r * 1.1, [[0, c1], [1, c2]]); ctx.fill();
  ctx.beginPath(); ctx.arc(x - r * .35, y - r * .4, r * .28, 0, 7); ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.fill();
}
function pearl(x, y, r) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fillStyle = rg(x - r * .3, y - r * .35, r * .1, r * 1.1, [[0, '#ffffff'], [.6, '#efe6d8'], [1, '#a89c8c']]); ctx.fill();
}
function beadsAlong(fn, n, r, grad) {
  for (let i = 0; i <= n; i++) { const [x, y] = fn(i / n); pearl(x, y, r); }
}
const qpt = (x0, y0, cx, cy, x1, y1) => t => [(1 - t) * (1 - t) * x0 + 2 * (1 - t) * t * cx + t * t * x1, (1 - t) * (1 - t) * y0 + 2 * (1 - t) * t * cy + t * t * y1];

// ---------------------------------------------------------------------
//  Skin palettes
// ---------------------------------------------------------------------
const SKR = { base: '#4f7ea3', light: '#86b4d0', dark: '#2c5473', deep: 'rgba(14,30,46,1)' };
const SKS = { base: '#d49a70', light: '#f3cca4', dark: '#a0623f', deep: 'rgba(80,36,20,1)' };

// ---------------------------------------------------------------------
//  FACE  (local coords: face width ±21, y from -32 (top) to 32 (chin))
// ---------------------------------------------------------------------
function faceShape() {
  ctx.beginPath(); ctx.moveTo(-20, -12); ctx.bezierCurveTo(-21.5, 8, -14, 25, -6, 29.5); ctx.quadraticCurveTo(0, 32.5, 6, 29.5);
  ctx.bezierCurveTo(14, 25, 21.5, 8, 20, -12); ctx.bezierCurveTo(19, -27, 8, -32, 0, -32); ctx.bezierCurveTo(-8, -32, -19, -27, -20, -12); ctx.closePath();
}
function eyeGeom(ex, ey, side) {
  return { ox: ex + side * 6.5, oy: ey - 1.0, ix: ex - side * 6.0, iy: ey + .9, u1: [ex - side * 2.2, ey - 4.6], u2: [ex + side * 3.2, ey - 4.7], l1: [ex + side * 3, ey + 2.8], l2: [ex - side * 2.5, ey + 3.1] };
}
function eyePath(g) { ctx.beginPath(); ctx.moveTo(g.ix, g.iy); ctx.bezierCurveTo(g.u1[0], g.u1[1], g.u2[0], g.u2[1], g.ox, g.oy); ctx.bezierCurveTo(g.l1[0], g.l1[1], g.l2[0], g.l2[1], g.ix, g.iy); ctx.closePath(); }
function drawEye(g, sk, o) {
  const side = g.ox > g.ix ? 1 : -1, cx = (g.ox + g.ix) / 2, cy = (g.oy + g.iy) / 2;
  ctx.save(); eyePath(g); ctx.clip();
  ctx.fillStyle = rg(cx, cy - 1, .5, 7, [[0, '#f1e8dc'], [.7, '#dccfbf'], [1, '#b49a88']]); ctx.fillRect(cx - 9, cy - 6, 18, 12);
  const ix = cx + o.gx, iy = cy - .5;
  ctx.beginPath(); ctx.arc(ix, iy, 3.5, 0, 7); ctx.fillStyle = rg(ix, iy + .6, .4, 3.5, [[0, o.iris1], [.6, o.iris2], [1, '#0f0a07']]); ctx.fill();
  ctx.beginPath(); ctx.arc(ix, iy, 1.35, 0, 7); ctx.fillStyle = '#050403'; ctx.fill();
  ctx.beginPath(); ctx.arc(ix - 1, iy - 1.1, .75, 0, 7); ctx.fillStyle = 'rgba(255,255,255,.92)'; ctx.fill();
  ctx.beginPath(); ctx.arc(ix + 1.2, iy + 1.2, .4, 0, 7); ctx.fillStyle = 'rgba(255,255,255,.4)'; ctx.fill();
  // upper-lid shadow on eyeball
  ctx.save(); ctx.filter = `blur(${.8 * S}px)`; ctx.strokeStyle = 'rgba(20,10,6,.7)'; ctx.lineWidth = 2.4; ctx.beginPath(); ctx.moveTo(g.ix, g.iy); ctx.bezierCurveTo(g.u1[0], g.u1[1], g.u2[0], g.u2[1], g.ox, g.oy); ctx.stroke(); ctx.restore();
  ctx.restore();
  // lash line + wing
  ctx.beginPath(); ctx.moveTo(g.ix - side * .3, g.iy + .1); ctx.bezierCurveTo(g.u1[0], g.u1[1] - .3, g.u2[0], g.u2[1] - .3, g.ox, g.oy);
  ctx.quadraticCurveTo(g.ox + side * 1.4, g.oy - .5, g.ox + side * 2.4 * o.wing, g.oy - 1.2 * o.wing);
  ctx.strokeStyle = '#0c0706'; ctx.lineWidth = o.lash; ctx.lineCap = 'round'; ctx.stroke();
  // lower lid
  ctx.beginPath(); ctx.moveTo(g.ix, g.iy + .2); ctx.bezierCurveTo(g.l2[0], g.l2[1] + .4, g.l1[0], g.l1[1] + .4, g.ox, g.oy + .3);
  ctx.strokeStyle = 'rgba(60,30,20,.45)'; ctx.lineWidth = .5; ctx.stroke();
  // crease
  ctx.beginPath(); ctx.moveTo(g.ix + side * .8, g.iy - 2.4); ctx.bezierCurveTo(g.u1[0], g.u1[1] - 2.2, g.u2[0], g.u2[1] - 2.0, g.ox + side * .8, g.oy - 1.6);
  ctx.strokeStyle = sk.deep.replace('1)', '.5)'); ctx.lineWidth = .55; ctx.stroke();
  // tear duct
  ctx.beginPath(); ctx.arc(g.ix + side * .4, g.iy + .1, .55, 0, 7); ctx.fillStyle = 'rgba(190,90,90,.8)'; ctx.fill();
}
function drawLid(g, skinCol, amt, lashW) { // amt 0..1 closed (dynamic, per frame)
  const mix = (a, b) => [a[0] + (b[0] - a[0]) * amt, a[1] + (b[1] - a[1]) * amt];
  const c1 = mix(g.u1, g.l2), c2 = mix(g.u2, g.l1);
  ctx.save(); ctx.beginPath(); ctx.moveTo(g.ix - (g.ox > g.ix ? .6 : -.6), g.iy + .1);
  ctx.bezierCurveTo(g.u1[0], g.u1[1] - 1, g.u2[0], g.u2[1] - 1, g.ox + (g.ox > g.ix ? .6 : -.6), g.oy);
  ctx.bezierCurveTo(c2[0], c2[1], c1[0], c1[1], g.ix, g.iy + .1); ctx.closePath();
  ctx.fillStyle = skinCol; ctx.fill();
  ctx.beginPath(); ctx.moveTo(g.ix, g.iy + .1); ctx.bezierCurveTo(c1[0], c1[1], c2[0], c2[1], g.ox, g.oy); ctx.strokeStyle = '#0c0706'; ctx.lineWidth = lashW; ctx.lineCap = 'round'; ctx.stroke();
  ctx.restore();
}
function brow(ex, side, o) {
  const pts = [[ex - side * 7.2, -10.6 + o.drop], [ex - side * 3, -12.2 - o.arch + o.drop], [ex + side * 2.5, -12.9 - o.arch + o.drop * .6], [ex + side * 7, -11.5 + o.drop * .4], [ex + side * 10.8, -8.8 + o.drop * .4]];
  const ws = [o.w * 1.0, o.w * 1.15, o.w * 1.0, o.w * .65, o.w * .22];
  ctx.save(); ctx.filter = `blur(${.18 * S}px)`; tubePath(pts, ws); ctx.fillStyle = o.col; ctx.fill(); ctx.restore();
  // hair texture
  ctx.save(); tubePath(pts, ws); ctx.clip(); ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.lineWidth = .25;
  for (let i = 0; i < 14; i++) { const t = i / 14, p = pts[Math.min(4, Math.floor(t * 4))]; ctx.beginPath(); ctx.moveTo(p[0] - side * 1, p[1] + 1); ctx.lineTo(p[0] + side * 1.6, p[1] - 1.1); ctx.stroke(); }
  ctx.restore();
}
// full face. o: {sk, female, iris1, iris2, gx, brow, lip1, lip2, blush}
function drawFace(o) {
  const sk = o.sk, F = faceShape;
  // ears (behind face)
  for (const s of [-1, 1]) {
    const ep = () => { ctx.beginPath(); ctx.ellipse(s * 20.6, 1.5, 3.4, 6.6, s * -.12, 0, 7); };
    shaded(ep, sk.base, [edge(ep, 2, .8, sk.deep, 1), blob(s * 20.8, 1.5, 1.5, 3.5, sk.dark, .8, .8)]);
  }
  // neck shadow cast by jaw is done in body layer
  shaded(F, lg(-21, 0, 21, 0, [[0, o.faceL], [.45, sk.base], [1, o.faceR]]), [
    blob(17.5, 6, 8, 26, sk.dark, .55, 6), blob(-17, 6, 5, 22, sk.dark, .25, 5),
    blob(-3, -19, 13, 6, sk.light, .55, 5), blob(-10.5, 8, 7, 6.5, sk.light, .35, 5), blob(4, -8, 6, 6, sk.light, .15, 5),
    { c: sk.dark, a: .5, b: 3.4, f: () => { ctx.beginPath(); ctx.ellipse(-9.5, -4.2, 8.4, 4.8, 0, 0, 7); ctx.fill(); ctx.beginPath(); ctx.ellipse(9.5, -4.2, 8.4, 4.8, 0, 0, 7); ctx.fill(); } },
    blob(0, 13.4, 6.5, 2.6, sk.deep, .5, 2), blob(0, 23.6, 6, 2, sk.deep, .32, 2), blob(-1, 27, 5, 2.6, sk.light, .3, 2.5),
    blob(0, 33, 20, 6, sk.deep, .6, 4),
    blob(-12.5, 12.5, 6.5, 5, o.blush, o.female ? .38 : .2, 5), blob(12.5, 12.5, 6.5, 5, o.blush, o.female ? .3 : .15, 5),
    sline([[-3.4, -4], [-3.8, 9]], 1.4, sk.deep, .22, 1.2), sline([[3.6, -4], [4.2, 9]], 2.6, sk.deep, .35, 1.4), sline([[-.8, -6], [-.8, 8]], 2.6, sk.light, .38, 1.4),
    blob(0, 10.8, 3.4, 2.6, sk.light, .5, 1.4),
    edge(F, 5, .55, sk.deep, 3)
  ]);
  // brows
  brow(-9.6, -1, o.brow); brow(9.6, 1, o.brow);
  // eyes
  const gl = eyeGeom(-9.6, -3.2, -1), gr = eyeGeom(9.6, -3.2, 1);
  drawEye(gl, sk, o.eye); drawEye(gr, sk, o.eye);
  // nose
  ctx.fillStyle = sk.deep;
  for (const s of [-1, 1]) {
    ctx.save(); ctx.filter = `blur(${.25 * S}px)`; ctx.fillStyle = 'rgba(25,10,8,.85)'; ctx.beginPath(); ctx.ellipse(s * 2.6, 13.4, 1.55, .85, s * .3, 0, 7); ctx.fill(); ctx.restore();
    ctx.beginPath(); ctx.moveTo(s * 5.2, 9.5); ctx.quadraticCurveTo(s * 6.8, 13, s * 3.6, 14.7); ctx.strokeStyle = sk.deep.replace('1)', '.45)'); ctx.lineWidth = .7; ctx.stroke();
  }
  // lips
  const up = () => { ctx.beginPath(); ctx.moveTo(-8, 20.4); ctx.bezierCurveTo(-5.5, 18.4, -2.3, 17.5, 0, 18.8); ctx.bezierCurveTo(2.3, 17.5, 5.5, 18.4, 8, 20.4); ctx.bezierCurveTo(4, 21.5, -4, 21.5, -8, 20.4); ctx.closePath(); };
  const lo = () => { ctx.beginPath(); ctx.moveTo(-8, 20.4); ctx.bezierCurveTo(-4, 21.7, 4, 21.7, 8, 20.4); ctx.bezierCurveTo(6.2, 24.6, 2.6, 25.8, 0, 25.8); ctx.bezierCurveTo(-2.6, 25.8, -6.2, 24.6, -8, 20.4); ctx.closePath(); };
  shaded(up, o.lip1, [blob(0, 18.6, 6, 1.4, 'rgba(0,0,0,1)', .25, 1), edge(up, 1.2, .35, '#2a0d0d', .6)]);
  shaded(lo, o.lip2, [blob(0, 21.8, 7, 1.4, 'rgba(0,0,0,1)', .3, 1), blob(-.5, 23.2, 3.4, 1, '#ffffff', .4, .7), blob(0, 25.4, 4, 1, '#000', .2, 1), edge(lo, 1.1, .3, '#2a0d0d', .6)]);
  ctx.beginPath(); ctx.moveTo(-8.4, 20.2); ctx.bezierCurveTo(-4, 21.9, 4, 21.9, 8.4, 20.2); ctx.strokeStyle = 'rgba(35,10,10,.85)'; ctx.lineWidth = .65; ctx.stroke();
  ctx.beginPath(); ctx.arc(-8.6, 20, .6, 0, 7); ctx.arc(8.6, 20, .6, 0, 7); ctx.fillStyle = sk.deep.replace('1)', '.35)'); ctx.fill();
}

// ---------------------------------------------------------------------
//  HAIR
// ---------------------------------------------------------------------
function hairStrands(path, n, seed, x0, x1, y0, y1, hi) {
  ctx.save(); path(); ctx.clip();
  for (let i = 0; i < n; i++) {
    const x = x0 + (x1 - x0) * rnd(i + seed), bend = (rnd(i + seed + 50) - .5) * 14;
    ctx.beginPath(); ctx.moveTo(x, y0 + rnd(i + seed + 70) * 8);
    ctx.bezierCurveTo(x + bend, y0 + (y1 - y0) * .3, x - bend * .6, y0 + (y1 - y0) * .65, x + bend * .5, y1);
    ctx.strokeStyle = rnd(i + seed + 9) > .5 ? hi : 'rgba(0,0,0,.55)'; ctx.lineWidth = .35 + rnd(i + seed + 3) * .5; ctx.stroke();
  }
  ctx.restore();
}

// =====================================================================
//  RAMA
// =====================================================================
function ramaHead() {
  const hy = 120, sf = 1.04;
  // long hair behind
  ctx.save(); ctx.translate(RX, 0);
  const hairBack = () => { ctx.beginPath(); ctx.moveTo(-25, 100); ctx.bezierCurveTo(-36, 128, -28, 156, -34, 186); ctx.bezierCurveTo(-30, 194, -22, 192, -18, 180); ctx.lineTo(-12, 150); ctx.lineTo(12, 150); ctx.lineTo(18, 180); ctx.bezierCurveTo(22, 192, 30, 194, 34, 186); ctx.bezierCurveTo(28, 156, 36, 128, 25, 100); ctx.bezierCurveTo(16, 66, -16, 66, -25, 100); ctx.closePath(); };
  shaded(hairBack, '#0d0b0e', [blob(-20, 130, 6, 40, '#4a5a78', .25, 5), blob(18, 130, 5, 40, '#3a4660', .2, 5), edge(hairBack, 5, .6, '#000', 3)]);
  hairStrands(hairBack, 70, 1, -34, 34, 90, 190, 'rgba(120,140,180,.35)');
  // face
  ctx.save(); ctx.translate(0, hy); ctx.scale(sf, sf);
  drawFace({
    sk: SKR, female: false, faceL: '#6a9bbc', faceR: '#2f5878', blush: '#8a5a98',
    iris1: '#8a5a30', iris2: '#3c2414', lip1: '#7a4e66', lip2: '#97607a', gx: 0,
    brow: { col: '#0f0c0c', w: 2.7, arch: .2, drop: 0 }, eye: { gx: 0, iris1: '#8a5a30', iris2: '#3c2414', lash: 1.15, wing: .5 }
  });
  // tilak (white U with red centre)
  ctx.beginPath(); ctx.moveTo(-3.4, -29); ctx.bezierCurveTo(-3.6, -21, -2.4, -16.5, 0, -15.6); ctx.bezierCurveTo(2.4, -16.5, 3.6, -21, 3.4, -29);

  [[190, 54], [956, 54]].forEach(([x, w]) => col(x, w, 330, 1010, ['#3a1c20', '#7a4636', '#2a1216'], 5));
  // arches between far columns
  ctx.save(); ctx.filter = 'blur(5px)'; ctx.strokeStyle = '#3a1c20'; ctx.lineWidth = 34;
  ctx.beginPath(); ctx.arc(600, 560, 410, Math.PI * 1.05, Math.PI * 1.95); ctx.stroke(); ctx.restore();
  ctx.save(); ctx.filter = 'blur(3px)'; ctx.strokeStyle = '#2a1216'; ctx.lineWidth = 40; ctx.beginPath(); ctx.arc(600, 700, 600, Math.PI * 1.06, Math.PI * 1.94); ctx.stroke(); ctx.restore();
  // hanging lamps (bokeh)
  for (let i = 0; i < 26; i++) {
    const x = 90 + rnd(i) * 1020, y = 120 + rnd(i + 20) * 700, r = 8 + rnd(i + 40) * 26;
    ctx.save(); ctx.filter = `blur(${r * .35}px)`; ctx.fillStyle = rg(x, y, 0, r, [[0, 'rgba(255,225,150,.85)'], [.6, 'rgba(255,170,80,.4)'], [1, 'rgba(255,140,60,0)']]); ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); ctx.restore();
  }
  // stone floor
  ctx.fillStyle = lg(0, 1000, 0, H, [[0, '#6a3a26'], [.4, '#3a1c12'], [1, '#120806']]); ctx.beginPath(); ctx.moveTo(0, 1040); ctx.lineTo(W, 1040); ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 2;
  for (let i = 0; i < 12; i++) { const y = 1040 + Math.pow(i / 11, 1.6) * 460; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  for (let i = -8; i <= 8; i++) { ctx.beginPath(); ctx.moveTo(600 + i * 40, 1040); ctx.lineTo(600 + i * 190, H); ctx.stroke(); }
  g = rg(600, 1250, 20, 640, [[0, 'rgba(255,190,110,.55)'], [1, 'rgba(255,170,90,0)']]); ctx.fillStyle = g; ctx.fillRect(0, 1000, W, 500);
  // depth blur on the whole background
  const tmp = document.createElement('canvas'); tmp.width = W; tmp.height = H; const tg = tmp.getContext('2d'); tg.drawImage(bg.c, 0, 0);
  ctx.filter = 'blur(2px)'; ctx.drawImage(tmp, 0, 0); ctx.filter = 'none';
  return bg;
}

// grain + vignette
const grain = (() => { const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d'); const d = g.createImageData(256, 256); for (let i = 0; i < d.data.length; i += 4) { const v = 128 + (rnd(i * .37) - .5) * 160; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } g.putImageData(d, 0, 0); return c; })();
const vig = (() => { const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d'); const r = g.createRadialGradient(W / 2, H * .5, H * .35, W / 2, H * .5, H * .85); r.addColorStop(0, 'rgba(0,0,0,0)'); r.addColorStop(1, 'rgba(10,3,2,.7)'); g.fillStyle = r; g.fillRect(0, 0, W, H); return c; })();

// =====================================================================
//  Build & animate
// =====================================================================
const BG = buildBG(), R = buildRama(), SI = buildSita();
const emb = Array.from({ length: 60 }, (_, i) => ({ x: rnd(i) * W, y: rnd(i + 99) * 1700, s: 1.2 + rnd(i + 3) * 3.2, v: 18 + rnd(i + 7) * 40, ph: rnd(i + 11) * 6.28, pet: i % 3 === 0 }));
const sx = d => d * S + TX, sy = d => d * S + TY;
const rPivot = [sx(RX), sy(495)], sPivot = [sx(SX), sy(495)];
const rHead = [sx(RX), sy(165)], sHead = [sx(SX), sy(188)];

function drawLayer(L, dx = 0, shearK = 0, shearY = 0) {
  out.save(); if (shearK) out.transform(1, 0, shearK, 1, -shearK * shearY, 0); out.drawImage(L.c, dx, 0); out.restore();
}
function withRot(px, py, a, fn) { out.save(); out.translate(px, py); out.rotate(a); out.translate(-px, -py); fn(); out.restore(); }
function designT(tx = 0, ty = 0) { out.translate(TX, TY); out.scale(S, S); out.translate(tx, ty); }

window.draw = function (t) {
  out.setTransform(1, 0, 0, 1, 0, 0); out.globalAlpha = 1; out.globalCompositeOperation = 'source-over'; out.filter = 'none';
  out.drawImage(BG.c, 0, 0);
  // god rays
  out.save(); out.globalCompositeOperation = 'screen'; out.translate(600, 760); out.rotate(Math.sin(t * .2) * .03);
  for (let i = 0; i < 16; i++) { out.rotate(Math.PI * 2 / 16); const a = .05 + .03 * Math.sin(t * .8 + i * 1.7); const g = out.createLinearGradient(0, 0, 0, -1300); g.addColorStop(0, `rgba(255,214,140,${a * 2})`); g.addColorStop(1, 'rgba(255,214,140,0)'); out.fillStyle = g; out.beginPath(); out.moveTo(-10, 0); out.lineTo(10, 0); out.lineTo(70, -1300); out.lineTo(-70, -1300); out.fill(); }
  out.restore();
  // intro easing
  const k = Math.min(1, t / 1.4), e = 1 - Math.pow(1 - k, 3);
  out.save(); out.globalAlpha = e; out.translate(0, (1 - e) * 26);
  // floor contact shadow
  out.save(); out.filter = 'blur(14px)'; out.fillStyle = 'rgba(10,3,1,.7)'; out.beginPath(); out.ellipse(sx(280), sy(496), 430, 26, 0, 0, 7); out.fill(); out.restore();
  // warm floor reflection
  out.save(); out.globalAlpha = .18 * e; out.translate(0, sy(496) * 2); out.scale(1, -1); out.filter = 'blur(6px)'; out.drawImage(R.low.c, 0, 0); out.drawImage(SI.low.c, 0, 0); out.restore();

  // ---------- SITA ----------
  withRot(sPivot[0], sPivot[1], Math.sin(t * 1.25 + .8) * .0055, () => {
    drawLayer(SI.back, 0, Math.sin(t * 1.4) * .012, sy(120));
    drawLayer(SI.low, 0, Math.sin(t * 1.6 + 2) * .008, sy(240));
    drawLayer(SI.up);
    withRot(sx(SX - 20), sy(260), Math.sin(t * 1.8) * .03, () => drawLayer(SI.lot));
    withRot(sHead[0], sHead[1], Math.sin(t * 1.0 + 1) * .012 - .06, () => {
      drawLayer(SI.head);
      // blink
      const ph = (t + 1.1) % 3.9, am = ph < .16 ? Math.sin(ph / .16 * Math.PI) : 0;
      if (am > .02) { out.save(); designT(SX, 150); out.scale(.82, .82); for (const [ex, sd] of [[-9.6, -1], [9.6, 1]]) drawLid(eyeGeom(ex, -3.2, sd), '#c68660', am, 1.7); out.restore(); }
    });
  });
  // ---------- RAMA ----------
  withRot(rPivot[0], rPivot[1], Math.sin(t * 1.3) * .005, () => {
    drawLayer(R.back, 0, Math.sin(t * 1.7) * .012, sy(170));
    drawLayer(R.low, 0, Math.sin(t * 1.5 + 1) * .01, sy(245));
    drawLayer(R.up);
    withRot(rHead[0], rHead[1], Math.sin(t * 1.1) * .012, () => {
      // halo (dynamic glow)
      const hc = [sx(RX), sy(88)], gl = .8 + .2 * Math.sin(t * 2.2);
      out.save(); out.globalCompositeOperation = 'screen';
      let g = out.createRadialGradient(hc[0], hc[1], 40, hc[0], hc[1], 250); g.addColorStop(0, `rgba(255,214,120,${.5 * gl})`); g.addColorStop(.5, `rgba(255,170,70,${.22 * gl})`); g.addColorStop(1, 'rgba(255,150,60,0)'); out.fillStyle = g; out.beginPath(); out.arc(hc[0], hc[1], 250, 0, 7); out.fill(); out.restore();
      out.save(); out.beginPath(); out.arc(hc[0], hc[1], 138, 0, 7);
      g = out.createRadialGradient(hc[0] - 30, hc[1] - 30, 10, hc[0], hc[1], 138); g.addColorStop(0, 'rgba(255,236,170,.55)'); g.addColorStop(.75, 'rgba(255,196,96,.38)'); g.addColorStop(1, 'rgba(255,176,60,.6)'); out.fillStyle = g; out.fill();
      out.lineWidth = 4; out.strokeStyle = `rgba(255,224,130,${.85 * gl})`; out.stroke();
      out.beginPath(); out.arc(hc[0], hc[1], 116, 0, 7); out.lineWidth = 2; out.setLineDash([2, 9]); out.strokeStyle = 'rgba(255,240,190,.8)'; out.stroke(); out.restore();
      drawLayer(R.head);
      const ph = t % 3.4, am = ph < .15 ? Math.sin(ph / .15 * Math.PI) : 0;
      if (am > .02) { out.save(); designT(RX, 118); out.scale(.93, .93); for (const [ex, sd] of [[-9.6, -1], [9.6, 1]]) drawLid(eyeGeom(ex, -3.2, sd), '#3f6a8c', am, 1.15); out.restore(); }
    });
  });
  // sparkles on gems / lotus
  out.save(); out.globalCompositeOperation = 'screen';
  [[RX, 226, 0], [RX, 36, 1], [SX, 256, 2], [SX - 20, 244, 3], [SX, 113, 4]].forEach(([dx, dy, i]) => {
    const a = Math.max(0, Math.sin(t * 2.1 + i * 1.9)) ** 6, x = sx(dx), y = sy(dy), r = 26 * a;
    if (a < .05) return;
    out.fillStyle = `rgba(255,248,215,${a})`; out.beginPath(); out.moveTo(x, y - r); out.quadraticCurveTo(x, y, x + r, y); out.quadraticCurveTo(x, y, x, y + r); out.quadraticCurveTo(x, y, x - r, y); out.quadraticCurveTo(x, y, x, y - r); out.fill();
  });
  out.restore();
  out.restore();
  // drifting embers + petals
  out.save(); out.globalCompositeOperation = 'screen';
  emb.forEach(p => {
    const y = H + 60 - ((p.y + t * p.v) % 1700) * 1, x = p.x + Math.sin(t * .8 + p.ph) * 30, al = .35 + .35 * Math.sin(t * 2 + p.ph);
    if (p.pet) { out.save(); out.translate(x, y); out.rotate(t * .7 + p.ph); out.scale(1, .5 + .5 * Math.abs(Math.sin(t + p.ph))); out.fillStyle = `rgba(255,170,190,${al * .9})`; out.beginPath(); out.ellipse(0, 0, p.s * 3.4, p.s * 1.8, 0, 0, 7); out.fill(); out.restore(); }
    else { const g = out.createRadialGradient(x, y, 0, x, y, p.s * 4); g.addColorStop(0, `rgba(255,220,140,${al})`); g.addColorStop(1, 'rgba(255,160,60,0)'); out.fillStyle = g; out.beginPath(); out.arc(x, y, p.s * 4, 0, 7); out.fill(); }
  });
  out.restore();
  // colour grade: warm rim light from the right + soft vignette + grain
  out.save(); out.globalCompositeOperation = 'soft-light'; let g = out.createLinearGradient(0, 0, W, 0); g.addColorStop(0, 'rgba(60,90,160,.35)'); g.addColorStop(.55, 'rgba(255,255,255,0)'); g.addColorStop(1, 'rgba(255,170,80,.5)'); out.fillStyle = g; out.fillRect(0, 0, W, H); out.restore();
  out.drawImage(vig, 0, 0);
  out.save(); out.globalCompositeOperation = 'overlay'; out.globalAlpha = .1; const gx = Math.floor(rnd(Math.floor(t * 24)) * 256), gy = Math.floor(rnd(Math.floor(t * 24) + 5) * 256);
  for (let x = -gx; x < W; x += 256) for (let y = -gy; y < H; y += 256) out.drawImage(grain, x, y); out.restore();
};
draw(2.5);
</script></body></html>
